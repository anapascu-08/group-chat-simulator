<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Group Chat Simulator</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 1rem;
    background: #f4f4f7;
    color: #1a1a1a;
  }
  h1 { font-size: 1.25rem; }
  #username-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
    font-size: 0.9rem;
  }
  #username-input {
    padding: 0.3rem 0.5rem;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 0.9rem;
    width: 140px;
  }
  #messages {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    min-height: 320px;
    max-height: 60vh;
    overflow-y: auto;
    padding: 0.75rem;
    background: white;
    border-radius: 8px;
    border: 1px solid #ddd;
    margin-bottom: 0.75rem;
  }
  .message {
    max-width: 80%;
    padding: 0.5rem 0.75rem;
    border-radius: 10px;
    background: #eee;
    align-self: flex-start;
  }
  .message.human { align-self: flex-end; background: #d6e8ff; }
  .message .name { font-weight: 600; font-size: 0.8rem; margin-bottom: 0.15rem; }
  .message .content { white-space: pre-wrap; word-break: break-word; }
  form { display: flex; gap: 0.5rem; }
  input[type="text"] {
    flex: 1;
    padding: 0.5rem;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 1rem;
  }
  button {
    padding: 0.5rem 1rem;
    border-radius: 6px;
    border: none;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-size: 1rem;
  }
  button.secondary { background: #999; }
  #status { font-size: 0.8rem; color: #666; min-height: 1.2em; margin-top: 0.35rem; }
</style>
</head>
<body>
  <h1>Group Chat Simulator</h1>
  <div id="username-bar">
    <label for="username-input">Numele tău:</label>
    <input type="text" id="username-input" placeholder="Tu" autocomplete="off" />
  </div>
  <div id="messages"></div>
  <form id="chat-form">
    <input type="text" id="message-input" placeholder="Scrie un mesaj..." autocomplete="off" />
    <button type="submit">Trimite</button>
    <button type="button" id="reset-button" class="secondary">Reset</button>
  </form>
  <div id="status"></div>

<script>
  const messagesEl = document.getElementById("messages");
  const formEl = document.getElementById("chat-form");
  const inputEl = document.getElementById("message-input");
  const resetButton = document.getElementById("reset-button");
  const statusEl = document.getElementById("status");
  const usernameInput = document.getElementById("username-input");

  const HUMAN_NAME = "Tu";
  const USERNAME_KEY = "gcs_username";
  const nameColors = new Map();
  const palette = ["#e11d48", "#059669", "#7c3aed", "#d97706", "#0891b2", "#be123c", "#4338ca"];

  usernameInput.value = localStorage.getItem(USERNAME_KEY) || "";
  usernameInput.addEventListener("change", () => {
    localStorage.setItem(USERNAME_KEY, usernameInput.value.trim());
  });

  function currentUsername() {
    return usernameInput.value.trim() || HUMAN_NAME;
  }

  function colorFor(name) {
    if (!nameColors.has(name)) {
      nameColors.set(name, palette[nameColors.size % palette.length]);
    }
    return nameColors.get(name);
  }

  function render(messages) {
    messagesEl.innerHTML = "";
    const me = currentUsername();
    for (const msg of messages) {
      const div = document.createElement("div");
      div.className = "message" + (msg.name === me ? " human" : "");

      const nameEl = document.createElement("div");
      nameEl.className = "name";
      nameEl.textContent = msg.name;
      nameEl.style.color = msg.name === me ? "#1d4ed8" : colorFor(msg.name);

      const contentEl = document.createElement("div");
      contentEl.className = "content";
      contentEl.textContent = msg.content;

      div.appendChild(nameEl);
      div.appendChild(contentEl);
      messagesEl.appendChild(div);
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function fetchMessages() {
    try {
      const response = await fetch("/messages");
      render(await response.json());
      statusEl.textContent = "";
    } catch (err) {
      statusEl.textContent = "Nu pot ajunge la server...";
    }
  }

  formEl.addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = inputEl.value.trim();
    if (!message) return;
    inputEl.value = "";
    statusEl.textContent = "Personas scriu...";
    await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, name: usernameInput.value.trim() }),
    });
    fetchMessages();
  });

  resetButton.addEventListener("click", async () => {
    await fetch("/reset", { method: "POST" });
    fetchMessages();
  });

  fetchMessages();
  setInterval(fetchMessages, 1500);
</script>
</body>
</html>
