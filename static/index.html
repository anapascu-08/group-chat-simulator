<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Group Chat Simulator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg-page: #dcdce3;
    --text-primary: #1a1a1a;
    --text-muted: #666;
    --text-faint: #888;
    --bg-surface: #f0f0f4;
    --bg-messages: #e2e2e8;
    --bg-message-other: #d3d3da;
    --bg-message-human: #bfd9fb;
    --border-color: #ccc;
    --border-color-light: #ddd;
    --accent-primary: #2563eb;
    --accent-secondary: #999;
    --accent-success: #059669;
    --accent-danger: #dc2626;
    --accent-mention: #4338ca;
    --mention-hover-bg: #eef2ff;
    --shadow-color: rgba(0, 0, 0, 0.2);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-page: #1a1a1f;
      --text-primary: #e8e8ec;
      --text-muted: #9a9aa4;
      --text-faint: #78787f;
      --bg-surface: #2a2a30;
      --bg-messages: #202024;
      --bg-message-other: #33333a;
      --bg-message-human: #2c4a6e;
      --border-color: #45454d;
      --border-color-light: #3a3a42;
      --accent-primary: #3b82f6;
      --accent-secondary: #6b6b74;
      --accent-success: #10b981;
      --accent-danger: #ef4444;
      --accent-mention: #818cf8;
      --mention-hover-bg: #2c2c55;
      --shadow-color: rgba(0, 0, 0, 0.5);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 1rem;
    background: var(--bg-page);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
  }
  h1 { font-size: 1.25rem; flex-shrink: 0; }
  #settings-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 0.4rem;
  }
  #username-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.9rem;
  }
  #username-input {
    padding: 0.3rem 0.5rem;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    font-size: 0.9rem;
    width: 140px;
    background: var(--bg-surface);
    color: var(--text-primary);
  }
  #personas-toggle {
    background: none;
    color: var(--text-muted);
    padding: 0.2rem 0;
    font-size: 0.8rem;
  }
  #personas-toggle:hover { color: var(--text-primary); }
  #personas-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-bottom: 0.75rem;
    padding: 0.6rem;
    background: var(--bg-messages);
    border: 1px solid var(--border-color);
    border-radius: 10px;
  }
  #personas-bar[hidden] { display: none; }
  .persona-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    background: var(--bg-surface);
    border: 1px solid var(--border-color-light);
    font-size: 0.8rem;
    white-space: nowrap;
  }
  .persona-chip-name { font-weight: 600; color: var(--persona-chip-color, var(--text-primary)); }
  .persona-chip .info-icon {
    font-size: 0.75rem;
    color: var(--text-muted);
    cursor: help;
  }
  #conversation-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
  }
  #conversation-dropdown {
    position: relative;
    flex: 1;
    min-width: 0;
  }
  #conversation-trigger {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.35rem 0.6rem;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    font-size: 0.85rem;
    background: var(--bg-surface);
    color: var(--text-primary);
    text-align: left;
  }
  #conversation-trigger-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #conversation-trigger-arrow {
    flex-shrink: 0;
    color: var(--text-muted);
    font-size: 0.7rem;
    transition: transform 0.15s ease;
  }
  #conversation-trigger[aria-expanded="true"] #conversation-trigger-arrow {
    transform: rotate(180deg);
  }
  #conversation-panel {
    position: absolute;
    top: calc(100% + 0.3rem);
    left: 0;
    right: 0;
    max-height: 320px;
    overflow-y: auto;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    box-shadow: 0 2px 10px var(--shadow-color);
    z-index: 10;
  }
  #conversation-panel[hidden] { display: none; }
  .conversation-row {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.5rem 0.6rem;
    cursor: pointer;
    border-bottom: 1px solid var(--border-color-light);
  }
  .conversation-row:last-child { border-bottom: none; }
  .conversation-row:hover { background: var(--mention-hover-bg); }
  .conversation-row.active { background: var(--mention-hover-bg); box-shadow: inset 3px 0 0 var(--accent-primary); }
  .conversation-row-main { flex: 1; min-width: 0; }
  .conversation-row-title {
    font-size: 0.85rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .conversation-row-meta { font-size: 0.75rem; color: var(--text-muted); }
  .conversation-row-delete {
    flex-shrink: 0;
    padding: 0.25rem 0.5rem;
    font-size: 0.8rem;
    background: transparent;
    color: var(--text-faint);
  }
  .conversation-row-delete:hover { color: white; background: var(--accent-danger); }
  .conversation-row-delete.confirming {
    background: var(--accent-danger);
    color: white;
    animation: confirm-pulse 0.6s ease-in-out infinite alternate;
  }
  .conversation-panel-empty {
    padding: 0.6rem;
    font-size: 0.85rem;
    color: var(--text-muted);
    text-align: center;
  }
  .conversation-panel-more {
    display: block;
    width: 100%;
    padding: 0.5rem 0.6rem;
    background: transparent;
    color: var(--accent-primary);
    font-size: 0.8rem;
    border-radius: 0;
  }
  .conversation-panel-more:hover { background: var(--mention-hover-bg); }
  #messages-wrap {
    position: relative;
    margin-bottom: 0.75rem;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  #messages-wrap.has-scroll-button { margin-bottom: 2.5rem; }
  #messages {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    flex: 1;
    min-height: 140px;
    overflow-y: auto;
    padding: 0.75rem;
    background: var(--bg-messages);
    border-radius: 8px;
    border: 1px solid var(--border-color);
  }
  #scroll-bottom-button {
    position: absolute;
    top: 100%;
    margin-top: 0.5rem;
    left: 50%;
    transform: translateX(-50%);
    padding: 0.35rem 0.9rem;
    border-radius: 999px;
    font-size: 0.8rem;
    box-shadow: 0 2px 8px var(--shadow-color);
  }
  .message {
    max-width: 72%;
    padding: 0.5rem 0.75rem;
    border-radius: 10px;
    background: var(--bg-message-other);
    border-left: 3px solid transparent;
    align-self: flex-start;
  }
  .message.human { align-self: flex-end; background: var(--bg-message-human); }
  .message .name-row { display: flex; align-items: baseline; gap: 0.4rem; margin-bottom: 0.15rem; }
  .message .name {
    font-weight: 600;
    font-size: 0.8rem;
    color: var(--persona-color, var(--accent-primary));
  }
  @media (prefers-color-scheme: dark) {
    /* culorile fixe per-persona (din personas.json) sunt gândite pentru fundal
       deschis — pe fundal întunecat, unele (ex. bleumarin închis) devin
       aproape ilizibile, așa că le deschidem amestecându-le cu alb */
    .message .name {
      color: color-mix(in srgb, var(--persona-color, var(--accent-primary)) 50%, white);
    }
  }
  .message .time { font-size: 0.7rem; color: var(--text-muted); }
  .message .time-self { text-align: right; margin-top: 0.2rem; }
  .message .content { white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
  .day-separator { display: flex; justify-content: center; margin: 0.75rem 0 0.25rem; }
  .day-separator:first-child { margin-top: 0; }
  .day-separator span {
    font-size: 0.72rem;
    color: var(--text-faint);
    background: var(--bg-surface);
    padding: 0.15rem 0.6rem;
    border-radius: 999px;
  }
  #empty-state {
    text-align: center;
    color: var(--text-faint);
    font-size: 0.9rem;
    padding: 2rem 1rem;
  }
  #empty-state p { margin: 0 0 0.75rem; }
  #prompt-suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    justify-content: center;
  }
  .suggestion-chip {
    background: var(--bg-surface);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
    border-radius: 999px;
    padding: 0.35rem 0.8rem;
    font-size: 0.78rem;
    line-height: 1.3;
  }
  .suggestion-chip:hover { background: var(--mention-hover-bg); }
  .typing-dots { display: flex; gap: 0.2rem; padding: 0.15rem 0; }
  .typing-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-secondary);
    animation: typing-bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
  form { display: flex; gap: 0.5rem; align-items: center; }
  input[type="text"] {
    flex: 1;
    padding: 0.5rem;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    font-size: 1rem;
  }
  #input-wrap { position: relative; flex: 1; }
  #message-input {
    width: 100%;
    padding: 0.5rem;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    font-size: 1rem;
    font-family: inherit;
    resize: none;
    min-height: 3.6rem;
    max-height: 8rem;
    line-height: 1.4;
    background: var(--bg-surface);
    color: var(--text-primary);
  }
  #message-input::placeholder { color: var(--text-muted); font-size: 0.95rem; }
  @media (prefers-color-scheme: dark) {
    /* placeholder-ul implicit al browserului iese prea subțire/estompat pe
       fundal întunecat — îl îngroșăm ca să se citească mai clar */
    #message-input::placeholder { font-weight: 600; }
  }
  #mention-list {
    position: absolute;
    bottom: 100%;
    left: 0;
    margin-bottom: 0.25rem;
    width: 100%;
    max-height: 180px;
    overflow-y: auto;
    background: var(--bg-surface);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    box-shadow: 0 2px 10px var(--shadow-color);
    z-index: 10;
  }
  .mention-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.45rem 0.7rem;
    cursor: pointer;
    font-size: 0.9rem;
    border-bottom: 1px solid var(--border-color-light);
  }
  .mention-item:last-child { border-bottom: none; }
  .mention-item:first-child { border-radius: 7px 7px 0 0; }
  .mention-item:last-child { border-radius: 0 0 7px 7px; }
  .mention-item.active, .mention-item:hover { background: var(--mention-hover-bg); }
  .mention-item-emoji { font-size: 1.05rem; flex-shrink: 0; }
  .mention-item-name { font-weight: 600; color: var(--mention-item-color, var(--text-primary)); }
  .mention-tag {
    font-weight: 600;
    color: var(--accent-mention);
  }
  button {
    padding: 0.5rem 1rem;
    border-radius: 6px;
    border: none;
    background: var(--accent-primary);
    color: white;
    cursor: pointer;
    font-size: 1rem;
    line-height: 1.4;
  }
  button.secondary { background: var(--accent-secondary); }
  button:disabled { opacity: 0.6; cursor: default; }
  #new-conversation-button { background: var(--accent-success); }
  @keyframes confirm-pulse {
    from { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.5); }
    to { box-shadow: 0 0 0 5px rgba(220, 38, 38, 0); }
  }
  #status { font-size: 0.8rem; color: var(--text-muted); min-height: 1.2em; margin-top: 0.35rem; }
</style>
</head>
<body>
  <h1>Group Chat Simulator</h1>
  <div id="settings-bar">
    <button type="button" id="personas-toggle" class="secondary" aria-controls="personas-bar" aria-expanded="false"></button>
    <div id="username-bar">
      <label for="username-input">Numele tău:</label>
      <input type="text" id="username-input" placeholder="Tu" autocomplete="off" />
    </div>
  </div>
  <div id="personas-bar" hidden></div>
  <div id="conversation-bar">
    <div id="conversation-dropdown">
      <button type="button" id="conversation-trigger" aria-haspopup="listbox" aria-expanded="false">
        <span id="conversation-trigger-title"></span>
        <span id="conversation-trigger-arrow" aria-hidden="true">▾</span>
      </button>
      <div id="conversation-panel" role="listbox" hidden></div>
    </div>
    <button type="button" id="new-conversation-button" class="secondary">+ Nouă</button>
  </div>
  <div id="messages-wrap">
    <div id="messages"></div>
    <button type="button" id="scroll-bottom-button" hidden>↓ Mesaje noi</button>
  </div>
  <form id="chat-form">
    <div id="input-wrap">
      <div id="mention-list" hidden></div>
      <textarea id="message-input" placeholder="Scrie un mesaj..." autocomplete="off" rows="1" autofocus></textarea>
    </div>
    <button type="submit" id="send-button">Trimite</button>
  </form>
  <div id="status" role="status" aria-live="polite"></div>

<script>
  const messagesWrapEl = document.getElementById("messages-wrap");
  const messagesEl = document.getElementById("messages");
  const formEl = document.getElementById("chat-form");
  const inputEl = document.getElementById("message-input");
  const statusEl = document.getElementById("status");
  const usernameInput = document.getElementById("username-input");
  const conversationDropdown = document.getElementById("conversation-dropdown");
  const conversationTrigger = document.getElementById("conversation-trigger");
  const conversationTriggerTitle = document.getElementById("conversation-trigger-title");
  const conversationPanel = document.getElementById("conversation-panel");
  const newConversationButton = document.getElementById("new-conversation-button");
  const mentionListEl = document.getElementById("mention-list");
  const scrollBottomButton = document.getElementById("scroll-bottom-button");
  const submitButton = document.getElementById("send-button");
  const personasBarEl = document.getElementById("personas-bar");
  const personasToggle = document.getElementById("personas-toggle");

  const HUMAN_NAME = "Tu";
  const USERNAME_KEY = "gcs_username";
  const CONVERSATION_KEY = "gcs_conversation_id";
  const PERSONAS_EXPANDED_KEY = "gcs_personas_expanded";
  let personasExpanded = localStorage.getItem(PERSONAS_EXPANDED_KEY) === "true";
  let currentConversationId = localStorage.getItem(CONVERSATION_KEY) || null;
  let conversationsCache = [];
  let conversationPanelOpen = false;
  let conversationPanelExpanded = false;
  const CONVERSATION_PANEL_LIMIT = 15;
  let deleteConfirmId = null;
  let deleteConfirmTimeout = null;
  const nameColors = new Map();
  const palette = ["#e11d48", "#059669", "#7c3aed", "#d97706", "#0891b2", "#be123c", "#4338ca"];
  const personaEmojis = new Map();
  let personas = [];
  let typingName = null;
  let forceScrollToBottom = false;
  let lastMessageCount = 0;
  let prevMessages = [];
  let lastRenderedMe = null;
  let mentionStart = -1;
  let mentionMatches = [];
  let mentionActiveIndex = -1;

  async function loadPersonas() {
    try {
      const response = await fetch("/personas");
      personas = await response.json();
      for (const p of personas) {
        if (p.emoji) personaEmojis.set(p.name, p.emoji);
      }
    } catch (err) {
      // fără emoji/autocompletare dacă /personas nu răspunde — restul UI-ului funcționează oricum
    }
  }

  function fold(text) {
    return text.normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  }

  function mentionTokens(name) {
    const words = name.split(/\s+/).map(fold);
    return [...words, fold(name.replace(/\s+/g, ""))];
  }

  // ce scrie userul chiar acum după un "@" nefinalizat (fără spațiu până la cursor)
  function currentMentionQuery() {
    const caret = inputEl.selectionStart;
    const upToCaret = inputEl.value.slice(0, caret);
    const match = upToCaret.match(/(?:^|\s)@(\w*)$/);
    if (!match) return null;
    return { query: match[1], start: caret - match[1].length - 1 };
  }

  function hideMentionList() {
    mentionListEl.hidden = true;
    mentionListEl.innerHTML = "";
    mentionStart = -1;
    mentionMatches = [];
    mentionActiveIndex = -1;
  }

  function renderMentionList() {
    mentionListEl.innerHTML = "";
    mentionMatches.forEach((p, i) => {
      const item = document.createElement("div");
      item.className = "mention-item" + (i === mentionActiveIndex ? " active" : "");

      const emoji = personaEmojis.get(p.name);
      if (emoji) {
        const emojiEl = document.createElement("span");
        emojiEl.className = "mention-item-emoji";
        emojiEl.textContent = emoji;
        item.appendChild(emojiEl);
      }
      const nameEl = document.createElement("span");
      nameEl.className = "mention-item-name";
      nameEl.textContent = p.name;
      nameEl.style.setProperty("--mention-item-color", colorFor(p.name));
      item.appendChild(nameEl);

      item.addEventListener("mousedown", (event) => {
        event.preventDefault(); // păstrează focusul/cursorul din textarea
        applyMention(p);
      });
      mentionListEl.appendChild(item);
    });
    mentionListEl.hidden = false;
  }

  function updateInputPlaceholder() {
    inputEl.placeholder = "Scrie un mesaj... @nume pentru a menționa";
  }

  function updateMentionAutocomplete() {
    // mențiunile au sens doar după ce conversația a pornit deja — primul
    // mesaj ar trebui să ajungă la tot grupul, nu țintit de la bun început
    if (lastMessageCount === 0) {
      hideMentionList();
      return;
    }
    const state = currentMentionQuery();
    if (!state) {
      hideMentionList();
      return;
    }
    const folded = fold(state.query);
    const matches = personas.filter((p) => mentionTokens(p.name).some((t) => t.startsWith(folded)));
    if (matches.length === 0) {
      hideMentionList();
      return;
    }
    mentionStart = state.start;
    mentionMatches = matches;
    mentionActiveIndex = 0;
    renderMentionList();
  }

  function applyMention(persona) {
    const token = persona.name.replace(/\s+/g, "");
    const caret = inputEl.selectionStart;
    const before = inputEl.value.slice(0, mentionStart);
    const after = inputEl.value.slice(caret);
    const insertion = `@${token} `;
    inputEl.value = before + insertion + after;
    const newCaret = before.length + insertion.length;
    hideMentionList();
    inputEl.focus();
    inputEl.setSelectionRange(newCaret, newCaret);
    autoGrow();
  }

  const MESSAGE_MENTION_RE = /@([\p{L}\p{N}_]+)/gu;

  // găsește persona a cărei mențiune "lipită" (@NumeFaraSpatiu) corespunde tokenului
  function personaForMentionToken(token) {
    const folded = fold(token);
    return personas.find((p) => mentionTokens(p.name).includes(folded));
  }

  // afișează @NumeFaraSpatiu ca "@Nume Cu Spații", evidențiat, fără să schimbe textul salvat
  function renderMessageContent(el, text) {
    el.textContent = "";
    let lastIndex = 0;
    for (const match of text.matchAll(MESSAGE_MENTION_RE)) {
      const persona = personaForMentionToken(match[1]);
      if (!persona) continue;
      const start = match.index;
      if (start > lastIndex) {
        el.appendChild(document.createTextNode(text.slice(lastIndex, start)));
      }
      const tag = document.createElement("span");
      tag.className = "mention-tag";
      tag.textContent = `@${persona.name}`;
      el.appendChild(tag);
      lastIndex = start + match[0].length;
    }
    if (lastIndex < text.length) {
      el.appendChild(document.createTextNode(text.slice(lastIndex)));
    }
  }

  const HUMAN_EMOJI = "🧑";

  function labelFor(name, isHuman = false) {
    if (isHuman) return `${HUMAN_EMOJI} ${name}`;
    const emoji = personaEmojis.get(name);
    return emoji ? `${emoji} ${name}` : name;
  }

  function tooltipFor(p) {
    return [p.bio, p.personality].filter(Boolean).join(" — ");
  }

  function updatePersonasToggle() {
    const count = personas.length;
    const arrow = personasExpanded ? "▾" : "▸";
    const participanti = count === 1 ? "participant" : "participanți";
    const actiune = personasExpanded ? "ascunde" : "vedea";
    personasToggle.textContent = `${count} ${participanti} în grup, apasă pentru a ${actiune} ${arrow}`;
    personasToggle.setAttribute("aria-expanded", String(personasExpanded));
    personasBarEl.hidden = !personasExpanded;
  }

  personasToggle.addEventListener("click", () => {
    personasExpanded = !personasExpanded;
    localStorage.setItem(PERSONAS_EXPANDED_KEY, String(personasExpanded));
    updatePersonasToggle();
  });

  function renderPersonasBar() {
    const bar = personasBarEl;
    bar.innerHTML = "";
    for (const p of personas) {
      const chip = document.createElement("span");
      chip.className = "persona-chip";
      const emoji = personaEmojis.get(p.name);
      if (emoji) chip.appendChild(document.createTextNode(`${emoji} `));
      const nameEl = document.createElement("span");
      nameEl.className = "persona-chip-name";
      nameEl.textContent = p.name;
      nameEl.style.setProperty("--persona-chip-color", colorFor(p.name));
      chip.appendChild(nameEl);
      const tooltip = tooltipFor(p);
      if (tooltip) {
        chip.title = tooltip;
        const infoIcon = document.createElement("span");
        infoIcon.className = "info-icon";
        infoIcon.textContent = "ⓘ";
        chip.appendChild(infoIcon);
      }
      bar.appendChild(chip);
    }
  }

  usernameInput.value = localStorage.getItem(USERNAME_KEY) || "";
  usernameInput.addEventListener("change", () => {
    localStorage.setItem(USERNAME_KEY, usernameInput.value.trim());
  });

  function currentUsername() {
    return usernameInput.value.trim() || HUMAN_NAME;
  }

  function colorFor(name) {
    const persona = personas.find((p) => p.name === name);
    if (persona && persona.color) return persona.color;
    if (!nameColors.has(name)) {
      nameColors.set(name, palette[nameColors.size % palette.length]);
    }
    return nameColors.get(name);
  }

  function isNearBottom() {
    const threshold = 80;
    return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight <= threshold;
  }

  function formatMessageTime(timestamp) {
    if (!timestamp) return "";
    const date = new Date(timestamp);
    if (isNaN(date)) return "";
    return date.toLocaleTimeString("ro-RO", { hour: "2-digit", minute: "2-digit" });
  }

  // cheie stabilă pentru "aceeași zi" (în ora locală), folosită să decidem
  // unde intercalăm un separator de zi între mesaje
  function dayKey(timestamp) {
    if (!timestamp) return null;
    const date = new Date(timestamp);
    if (isNaN(date)) return null;
    return date.toDateString();
  }

  function formatDaySeparator(timestamp) {
    const date = new Date(timestamp);
    if (isNaN(date)) return "";
    const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const diffDays = Math.round((startOfDay(new Date()) - startOfDay(date)) / 86400000);
    const fullDate = date.toLocaleDateString("ro-RO", {
      day: "numeric",
      month: "long",
      year: date.getFullYear() !== new Date().getFullYear() ? "numeric" : undefined,
    });
    if (diffDays === 0) return `Azi, ${fullDate}`;
    if (diffDays === 1) return `Ieri, ${fullDate}`;
    return fullDate;
  }

  function createDaySeparatorEl(timestamp) {
    const div = document.createElement("div");
    div.className = "day-separator";
    const span = document.createElement("span");
    span.textContent = formatDaySeparator(timestamp);
    div.appendChild(span);
    return div;
  }

  const PROMPT_SUGGESTIONS = [
    { label: "Întreabă grupul unde mergem în vacanță", message: "Unde mergem anul ăsta în vacanță?" },
    { label: "Cere-le părerea despre ce să gătești diseară", message: "Ce ar trebui să gătesc diseară?" },
    { label: "Întreabă-i ce cred despre ultimele știri", message: "Ați văzut ultimele știri? Ce părere aveți?" },
    { label: "Provoacă-i cu o dilemă", message: "Ce preferați: la munte sau la mare?" },
  ];

  function renderPromptSuggestions(container) {
    const wrap = document.createElement("div");
    wrap.id = "prompt-suggestions";
    for (const suggestion of PROMPT_SUGGESTIONS) {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "suggestion-chip";
      chip.textContent = suggestion.label;
      chip.addEventListener("click", () => {
        inputEl.value = suggestion.message;
        autoGrow();
        inputEl.focus();
      });
      wrap.appendChild(chip);
    }
    container.appendChild(wrap);
  }

  function setScrollButtonVisible(visible) {
    scrollBottomButton.hidden = !visible;
    messagesWrapEl.classList.toggle("has-scroll-button", visible);
  }

  function messagesEqual(a, b) {
    return !!a && !!b && a.name === b.name && a.content === b.content && a.timestamp === b.timestamp;
  }

  // construiește o singură bulă; sameSpeakerAsPrev e null pentru primul mesaj
  // din listă (fără spațiere deasupra), altfel true/false după cum vorbitorul
  // se repetă sau nu față de bula anterioară — asta dă ritmul de grupare
  function createMessageEl(msg, me, sameSpeakerAsPrev) {
    const isMe = msg.name === me;
    const div = document.createElement("div");
    div.className = "message" + (isMe ? " human" : "");
    div.dataset.name = msg.name;
    div.style.marginTop = sameSpeakerAsPrev === null ? "0" : sameSpeakerAsPrev ? "0.15rem" : "0.75rem";

    if (!isMe) {
      const color = colorFor(msg.name);
      div.style.background = `color-mix(in srgb, ${color} 22%, var(--bg-message-other))`;
      div.style.borderLeft = `3px solid ${color}`;

      const nameRow = document.createElement("div");
      nameRow.className = "name-row";

      const nameEl = document.createElement("span");
      nameEl.className = "name";
      nameEl.textContent = labelFor(msg.name, false);
      nameEl.style.setProperty("--persona-color", color);
      nameRow.appendChild(nameEl);

      const time = formatMessageTime(msg.timestamp);
      if (time) {
        const timeEl = document.createElement("span");
        timeEl.className = "time";
        timeEl.textContent = time;
        nameRow.appendChild(timeEl);
      }

      div.appendChild(nameRow);
    }

    const contentEl = document.createElement("div");
    contentEl.className = "content";
    renderMessageContent(contentEl, msg.content);
    div.appendChild(contentEl);

    // în chat-urile reale nu-ți vezi propriul nume — doar ora, discretă, în
    // colțul bulei
    if (isMe) {
      const time = formatMessageTime(msg.timestamp);
      if (time) {
        const timeEl = document.createElement("div");
        timeEl.className = "time time-self";
        timeEl.textContent = time;
        div.appendChild(timeEl);
      }
    }

    return div;
  }

  function render(messages) {
    const shouldStickToBottom = forceScrollToBottom || isNearBottom();
    forceScrollToBottom = false;

    if (messages.length === 0) {
      messagesEl.innerHTML = "";
      const empty = document.createElement("div");
      empty.id = "empty-state";
      const text = document.createElement("p");
      text.textContent = "Niciun mesaj încă — scrie primul mesaj mai jos, sau încearcă:";
      empty.appendChild(text);
      renderPromptSuggestions(empty);
      messagesEl.appendChild(empty);
      setScrollButtonVisible(false);
      lastMessageCount = 0;
      prevMessages = [];
      updateInputPlaceholder();
      return;
    }

    const me = currentUsername();
    // randare incrementală: dacă lista anterioară e un prefix neschimbat al
    // celei noi, adăugăm doar mesajele noi în loc să rescriem tot DOM-ul —
    // altfel un poll la 1.5s întrerupe orice selecție de text în curs
    const canAppend =
      me === lastRenderedMe &&
      prevMessages.length > 0 &&
      prevMessages.length <= messages.length &&
      messagesEqual(prevMessages[prevMessages.length - 1], messages[prevMessages.length - 1]);

    if (!canAppend) {
      messagesEl.innerHTML = "";
      let prevName = null;
      let prevDay = null;
      for (const msg of messages) {
        const day = dayKey(msg.timestamp);
        if (day && day !== prevDay) {
          messagesEl.appendChild(createDaySeparatorEl(msg.timestamp));
          prevName = null; // ziua nouă marchează oricum o pauză vizuală
          prevDay = day;
        }
        const sameSpeaker = prevName === null ? null : prevName === msg.name;
        messagesEl.appendChild(createMessageEl(msg, me, sameSpeaker));
        prevName = msg.name;
      }
    } else {
      let prevName = prevMessages[prevMessages.length - 1].name;
      let prevDay = dayKey(prevMessages[prevMessages.length - 1].timestamp);
      for (let i = prevMessages.length; i < messages.length; i++) {
        const msg = messages[i];
        const day = dayKey(msg.timestamp);
        if (day && day !== prevDay) {
          messagesEl.appendChild(createDaySeparatorEl(msg.timestamp));
          prevName = null;
          prevDay = day;
        }
        const sameSpeaker = prevName === null ? null : prevName === msg.name;
        messagesEl.appendChild(createMessageEl(msg, me, sameSpeaker));
        prevName = msg.name;
      }
    }

    prevMessages = messages;
    lastRenderedMe = me;

    if (shouldStickToBottom) {
      messagesEl.scrollTop = messagesEl.scrollHeight;
      setScrollButtonVisible(false);
    } else if (messages.length > lastMessageCount) {
      setScrollButtonVisible(true);
    }
    lastMessageCount = messages.length;
    updateInputPlaceholder();
  }

  function renderTypingBubble() {
    const shouldStickToBottom = isNearBottom();
    const existing = document.getElementById("typing-bubble");
    if (existing) existing.remove();
    if (!typingName) return;

    const div = document.createElement("div");
    div.id = "typing-bubble";
    div.className = "message";
    const typingColor = colorFor(typingName);
    div.style.background = `color-mix(in srgb, ${typingColor} 22%, var(--bg-message-other))`;
    div.style.borderLeft = `3px solid ${typingColor}`;
    const lastMessageEl = messagesEl.querySelector(".message:last-child");
    div.style.marginTop = lastMessageEl
      ? lastMessageEl.dataset.name === typingName
        ? "0.15rem"
        : "0.75rem"
      : "0";

    const nameEl = document.createElement("div");
    nameEl.className = "name";
    nameEl.textContent = labelFor(typingName);
    nameEl.style.setProperty("--persona-color", typingColor);

    const dots = document.createElement("div");
    dots.className = "typing-dots";
    dots.innerHTML = "<span></span><span></span><span></span>";

    div.appendChild(nameEl);
    div.appendChild(dots);
    messagesEl.appendChild(div);
    if (shouldStickToBottom) {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }

  async function fetchTyping() {
    if (!currentConversationId) return;
    try {
      const response = await fetch(`/conversations/${currentConversationId}/typing`);
      const data = await response.json();
      typingName = data.name;
    } catch (err) {
      typingName = null;
    }
    renderTypingBubble();
  }

  function relativeWhen(date) {
    if (isNaN(date)) return "";
    const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const diffDays = Math.round((startOfDay(new Date()) - startOfDay(date)) / 86400000);
    const time = date.toLocaleTimeString("ro-RO", { hour: "2-digit", minute: "2-digit" });
    if (diffDays === 0) return `azi, ${time}`;
    if (diffDays === 1) return `ieri, ${time}`;
    return date.toLocaleDateString("ro-RO", {
      day: "numeric",
      month: "short",
      year: date.getFullYear() !== new Date().getFullYear() ? "numeric" : undefined,
    });
  }

  function formatConversationMeta(conv) {
    const when = relativeWhen(new Date(conv.created_at));
    const count = conv.message_count === 1 ? "1 mesaj" : `${conv.message_count} mesaje`;
    return when ? `${when} · ${count}` : count;
  }

  function closeConversationPanel() {
    conversationPanelOpen = false;
    conversationPanelExpanded = false;
    conversationPanel.hidden = true;
    conversationTrigger.setAttribute("aria-expanded", "false");
  }

  function openConversationPanel() {
    conversationPanelOpen = true;
    conversationPanel.hidden = false;
    conversationTrigger.setAttribute("aria-expanded", "true");
  }

  function toggleConversationPanel() {
    if (conversationPanelOpen) closeConversationPanel();
    else openConversationPanel();
  }

  function updateConversationTrigger() {
    const current = conversationsCache.find((c) => c.id === currentConversationId);
    conversationTriggerTitle.textContent = current ? current.title : "Fără conversații";
  }

  function selectConversation(id) {
    closeConversationPanel();
    if (id === currentConversationId) return;
    currentConversationId = id;
    localStorage.setItem(CONVERSATION_KEY, currentConversationId);
    typingName = null;
    forceScrollToBottom = true;
    prevMessages = [];
    resetDeleteConfirm();
    clearDraftInput();
    updateConversationTrigger();
    renderConversationPanel();
    poll();
  }

  async function deleteConversation(id) {
    resetDeleteConfirm();
    await fetch(`/conversations/${id}`, { method: "DELETE" });
    if (id === currentConversationId) {
      currentConversationId = null;
      await switchToEmptyConversation();
    } else {
      await loadConversations();
    }
  }

  function renderConversationPanel() {
    conversationPanel.innerHTML = "";
    if (conversationsCache.length === 0) {
      const empty = document.createElement("div");
      empty.className = "conversation-panel-empty";
      empty.textContent = "Nicio conversație încă";
      conversationPanel.appendChild(empty);
      return;
    }
    const visibleConversations = conversationPanelExpanded
      ? conversationsCache
      : conversationsCache.slice(0, CONVERSATION_PANEL_LIMIT);

    for (const conv of visibleConversations) {
      const row = document.createElement("div");
      row.className = "conversation-row" + (conv.id === currentConversationId ? " active" : "");
      row.setAttribute("role", "option");
      row.setAttribute("aria-selected", conv.id === currentConversationId ? "true" : "false");
      row.addEventListener("click", () => selectConversation(conv.id));

      const main = document.createElement("div");
      main.className = "conversation-row-main";
      const title = document.createElement("div");
      title.className = "conversation-row-title";
      title.textContent = conv.title;
      const meta = document.createElement("div");
      meta.className = "conversation-row-meta";
      meta.textContent = formatConversationMeta(conv);
      main.appendChild(title);
      main.appendChild(meta);

      const isConfirming = deleteConfirmId === conv.id;
      const deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.className = "conversation-row-delete" + (isConfirming ? " confirming" : "");
      deleteBtn.textContent = isConfirming ? "Sigur?" : "🗑";
      deleteBtn.setAttribute("aria-label", `Șterge conversația „${conv.title}”`);
      deleteBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        if (deleteConfirmId !== conv.id) {
          deleteConfirmId = conv.id;
          if (deleteConfirmTimeout) clearTimeout(deleteConfirmTimeout);
          deleteConfirmTimeout = setTimeout(resetDeleteConfirm, 3000);
          renderConversationPanel();
          return;
        }
        deleteConversation(conv.id);
      });

      row.appendChild(main);
      row.appendChild(deleteBtn);
      conversationPanel.appendChild(row);
    }

    if (!conversationPanelExpanded && conversationsCache.length > CONVERSATION_PANEL_LIMIT) {
      const remaining = conversationsCache.length - CONVERSATION_PANEL_LIMIT;
      const showMore = document.createElement("button");
      showMore.type = "button";
      showMore.className = "conversation-panel-more";
      showMore.textContent = `Arată încă ${remaining} conversații`;
      showMore.addEventListener("click", (event) => {
        event.stopPropagation();
        conversationPanelExpanded = true;
        renderConversationPanel();
      });
      conversationPanel.appendChild(showMore);
    }
  }

  function resetDeleteConfirm() {
    if (deleteConfirmTimeout) {
      clearTimeout(deleteConfirmTimeout);
      deleteConfirmTimeout = null;
    }
    if (deleteConfirmId) {
      deleteConfirmId = null;
      renderConversationPanel();
    }
  }

  async function loadConversations() {
    const response = await fetch("/conversations");
    const conversations = await response.json();
    conversationsCache = conversations;

    const knownIds = new Set(conversations.map((c) => c.id));
    if (!currentConversationId || !knownIds.has(currentConversationId)) {
      currentConversationId = conversations[0] ? conversations[0].id : null;
    }

    updateConversationTrigger();
    renderConversationPanel();

    if (currentConversationId) {
      localStorage.setItem(CONVERSATION_KEY, currentConversationId);
    }
  }

  async function fetchMessages() {
    if (!currentConversationId) return;
    try {
      const response = await fetch(`/conversations/${currentConversationId}/messages`);
      render(await response.json());
      renderTypingBubble();
      statusEl.textContent = "";
    } catch (err) {
      statusEl.textContent = "Nu pot ajunge la server...";
    }
  }

  async function poll() {
    await fetchMessages();
    await fetchTyping();
  }

  scrollBottomButton.addEventListener("click", () => {
    messagesEl.scrollTop = messagesEl.scrollHeight;
    setScrollButtonVisible(false);
  });

  messagesEl.addEventListener("scroll", () => {
    if (isNearBottom()) setScrollButtonVisible(false);
  });

  function clearDraftInput() {
    // mesajul netrimis (ex. o mențiune @nume începută) aparține conversației
    // curente — la schimbarea conversației nu trebuie să rămână în căsuța de
    // scris, altfel "se scurge" într-o conversație unde n-are sens
    inputEl.value = "";
    autoGrow();
    hideMentionList();
  }

  conversationTrigger.addEventListener("click", () => {
    toggleConversationPanel();
  });

  async function switchToEmptyConversation() {
    // dacă există deja o conversație goală, o refolosim în loc să mai creăm una
    const existing = await (await fetch("/conversations")).json();
    const emptyConversation = existing.find((c) => c.message_count === 0);
    if (emptyConversation) {
      currentConversationId = emptyConversation.id;
    } else {
      const created = await (await fetch("/conversations", { method: "POST" })).json();
      currentConversationId = created.id;
    }
    localStorage.setItem(CONVERSATION_KEY, currentConversationId);
    typingName = null;
    forceScrollToBottom = true;
    prevMessages = [];
    clearDraftInput();
    await loadConversations();
    poll();
  }

  newConversationButton.addEventListener("click", async () => {
    await switchToEmptyConversation();
  });

  function autoGrow() {
    if (!inputEl.value) {
      inputEl.style.height = "";
      return;
    }
    inputEl.style.height = "auto";
    inputEl.style.height = `${inputEl.scrollHeight}px`;
  }
  inputEl.addEventListener("input", () => {
    autoGrow();
    updateMentionAutocomplete();
  });

  inputEl.addEventListener("keydown", (event) => {
    if (!mentionListEl.hidden) {
      if (event.key === "ArrowDown") {
        event.preventDefault();
        mentionActiveIndex = (mentionActiveIndex + 1) % mentionMatches.length;
        renderMentionList();
        return;
      }
      if (event.key === "ArrowUp") {
        event.preventDefault();
        mentionActiveIndex = (mentionActiveIndex - 1 + mentionMatches.length) % mentionMatches.length;
        renderMentionList();
        return;
      }
      if (event.key === "Enter" || event.key === "Tab") {
        event.preventDefault();
        applyMention(mentionMatches[mentionActiveIndex]);
        return;
      }
      if (event.key === "Escape") {
        hideMentionList();
        return;
      }
    }
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      formEl.requestSubmit();
    }
  });

  document.addEventListener("click", (event) => {
    if (!mentionListEl.hidden && !mentionListEl.contains(event.target) && event.target !== inputEl) {
      hideMentionList();
    }
    resetDeleteConfirm();
    if (conversationPanelOpen && !conversationDropdown.contains(event.target)) {
      closeConversationPanel();
    }
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && conversationPanelOpen) {
      closeConversationPanel();
    }
  });

  formEl.addEventListener("submit", async (event) => {
    event.preventDefault();
    const message = inputEl.value.trim();
    if (!message || !currentConversationId) return;
    inputEl.value = "";
    autoGrow();
    hideMentionList();
    statusEl.textContent = "Personas scriu...";
    submitButton.disabled = true;
    // cererea locală răspunde aproape instant — ținem butonul dezactivat cel
    // puțin 300ms ca userul să apuce să vadă feedback-ul vizual
    const minVisible = new Promise((resolve) => setTimeout(resolve, 300));
    const sendWork = (async () => {
      const response = await fetch(`/conversations/${currentConversationId}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, name: usernameInput.value.trim() }),
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      await loadConversations();
    })();
    try {
      await Promise.all([sendWork, minVisible]);
      poll();
    } catch (err) {
      // trimiterea a eșuat (server jos, rețea etc.) — punem mesajul înapoi,
      // ca userul să nu-l piardă, doar dacă n-a apucat între timp să scrie altceva
      if (!inputEl.value) {
        inputEl.value = message;
        autoGrow();
      }
      statusEl.textContent = "Nu am putut trimite mesajul — încearcă din nou.";
    } finally {
      submitButton.disabled = false;
      inputEl.focus();
    }
  });

  async function init() {
    await loadPersonas();
    renderPersonasBar();
    updatePersonasToggle();
    await loadConversations();
    await poll();
    setInterval(poll, 1500);
    inputEl.focus();
  }

  init();
</script>
</body>
</html>
